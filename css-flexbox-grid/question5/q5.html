<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Plans</title>
    <link rel="stylesheet" href="q5.css">
</head>
<body>
    <main class="pricing">
        <div class="card">
            <h2>Basic</h2>
            <h3>$9/month</h3>
            <p>5 Projects</p>
            <p>Email Support</p>
            <button>Choose Plan</button>
        </div>

        <div class="card featured">
            <h2>Pro</h2>
            <h3>$19/month</h3>
            <p>20 Projects</p>
            <p>Priority Support</p>
            <button>Choose Plan</button>
        </div>

        <div class="card">
            <h2>Premium</h2>
            <h3>$29/month</h3>
            <p>Unlimited Projects</p>
            <p>24/7 Support</p>
            <button>Choose Plan</button>
        </div>
    </main>
</body>
</html>
